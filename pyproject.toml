[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birkin"
version = "0.1.0"
description = "Birkin — the open Agent Authorization & Evidence Layer. Runtime-agnostic control plane for autonomous agents: signed receipts, verifiable audit ledger, offline verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Birkin Contributors" }]
keywords = ["agents", "authorization", "audit", "evidence", "cryptography", "governance", "policy", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "cryptography>=42",
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
birkin = "birkin.cli:app"

[tool.setuptools.packages.find]
include = ["birkin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
