# =============================================================================
# Birkin — iPhone control + governance for your existing Hermes agent.
#
# Birkin does NOT install Hermes. Point it at a Hermes you're already running:
#
#   HERMES_URL=http://host.docker.internal:8686 docker compose up -d
#
# Then open http://localhost:3000 on your iPhone (same WiFi), Share →
# Add to Home Screen, and you have a governed PWA control surface.
#
# Hermes docs: https://hermes-agent.nousresearch.com/
#
# Stop:    docker compose down
# Reset:   docker compose down -v
# Audit:   ./governance-check.sh   |   ./tests/tamper-test.sh
# =============================================================================

services:

  # ─── nginx (PWA gateway) ─────────────────────────────────────────────────────
  # Injects Apple meta tags into every HTML response via sub_filter so
  # "Add to Home Screen" gives a full-screen app with no Safari chrome.
  # Also serves manifest.json and PWA icons from ./static/.
  nginx:
    image: nginx:1.27-alpine
    container_name: birkin-nginx
    restart: unless-stopped
    ports:
      - "${BIRKIN_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - open-webui
    networks:
      - birkin

  # ─── Open WebUI ─────────────────────────────────────────────────────────────
  # iPhone-friendly chat UI with voice input. PWA-installable.
  # Talks to your existing Hermes over its OpenAI-compatible /v1 endpoint.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: birkin-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: "${HERMES_URL:-http://host.docker.internal:8686}/v1"
      OPENAI_API_KEY: "${HERMES_API_KEY:-hermes-local}"
      WEBUI_NAME: "Birkin"
      WEBUI_URL: "http://localhost:${BIRKIN_PORT:-3000}"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      ENABLE_LOGIN_FORM: "true"
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "duckduckgo"
      ENABLE_COMMUNITY_SHARING: "false"
      AUDIO_STT_ENGINE: "openai"
      AUDIO_STT_OPENAI_API_BASE_URL: "${HERMES_URL:-http://host.docker.internal:8686}/v1"
    volumes:
      - webui-data:/app/backend/data
      - ./assets/birkin-icon.png:/app/public/logo.png:ro
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility for host.docker.internal
    networks:
      - birkin

  # ─── Health + Governance Endpoint ───────────────────────────────────────────
  # Flask app exposing governance JSON status on port 9999.
  #   curl http://localhost:9999/health | jq .
  health:
    build:
      context: .
      dockerfile: health/Dockerfile
    container_name: birkin-health
    restart: unless-stopped
    environment:
      HERMES_API_URL: "${HERMES_URL:-http://host.docker.internal:8686}"
      HERMES_AUDIT_DB: "/data/audit.db"
      HERMES_SKILLS_DIR: "/app/skills"
      HERMES_DRIFT_DIR: "/data/drift"
      HEALTH_PORT: "9999"
    volumes:
      - birkin-data:/data
      - ./skills:/app/skills:ro
    ports:
      - "9999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - birkin

  # ─── Governance Scheduler ───────────────────────────────────────────────────
  # Runs weekly drift-check against the configured Hermes endpoint.
  scheduler:
    image: python:3.12-alpine
    container_name: birkin-scheduler
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache curl sqlite bash git &&
        while true; do
          echo '[scheduler] drift-check at '$$(date -u) ;
          bash /app/scripts/drift-check.sh 2>&1 | tail -5 || true ;
          sleep 604800
        done
      "
    environment:
      HERMES_API_URL: "${HERMES_URL:-http://host.docker.internal:8686}"
      HERMES_AUDIT_DB: "/data/audit.db"
      HERMES_DRIFT_DIR: "/data/drift"
    volumes:
      - ./scripts:/app/scripts:ro
      - birkin-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - birkin

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  birkin-data:
    driver: local
    labels:
      com.birkin.description: "Audit log + drift results"
  webui-data:
    driver: local
    labels:
      com.birkin.description: "Open WebUI user data and settings"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  birkin:
    driver: bridge
