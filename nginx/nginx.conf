events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sub_filter_types text/html;
    sub_filter_once  on;

    upstream openwebui { server birkin-webui:8080; }

    server {
        listen 80;
        server_name _;

        # ── PWA static assets ───────────────────────────────────────────────
        location = /manifest.json {
            alias /usr/share/nginx/html/static/manifest.json;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type  "application/json";
        }
        location = /apple-touch-icon.png {
            alias /usr/share/nginx/html/static/apple-touch-icon.png;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /icon-192.png {
            alias /usr/share/nginx/html/static/icon-192.png;
            add_header Cache-Control "public, max-age=86400";
        }
        location = /icon-512.png {
            alias /usr/share/nginx/html/static/icon-512.png;
            add_header Cache-Control "public, max-age=86400";
        }

        # ── Open WebUI — inject Apple PWA meta tags + manifest ──────────────
        location / {
            proxy_pass http://openwebui;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            sub_filter '</head>'
                '<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birkin">
<meta name="theme-color" content="#0A0F1A">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>';
        }
    }
}
