name: Birkin CI Smoke Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  smoke:
    name: Vertical slice must hold
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Birkin (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the CI smoke gate
        # If this script exits non-zero, the release is red. No exceptions.
        # See scripts/ci_smoke.sh for what each of the 7 gates checks.
        run: bash scripts/ci_smoke.sh
